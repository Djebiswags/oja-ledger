<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oja Ledger</title><meta name="theme-color" content="#f4f1ea"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--g:#0a9d63;--ink:#0b0b0f;--muted:#5d6170;--glass:rgba(255,255,255,.55);--edge:rgba(255,255,255,.75)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:-apple-system,"SF Pro Display","SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;color:var(--ink);
 background:radial-gradient(1200px 600px at 10% -10%,#ffd88a 0,transparent 60%),radial-gradient(900px 600px at 110% 10%,#8fe3c0 0,transparent 55%),radial-gradient(900px 700px at 50% 120%,#a9c8ff 0,transparent 60%),#f4f1ea;background-attachment:fixed}
header{position:sticky;top:0;z-index:5;padding:20px 20px 14px;backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);background:rgba(255,255,255,.35);border-bottom:1px solid var(--edge);display:flex;align-items:center;gap:14px}
.appicon{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:28px;background:linear-gradient(145deg,#2fd08a,#0a7d4f);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 8px 20px rgba(10,125,79,.35)}
header h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em}header p{margin:2px 0 0;color:var(--muted);font-size:14px}
main{max-width:560px;margin:auto;padding:16px 16px 40px}
.box{background:var(--glass);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--edge);border-radius:28px;padding:18px;margin-bottom:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 10px 30px rgba(0,0,0,.08);animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
h3{font-size:20px;letter-spacing:-.01em}
textarea{width:100%;font:inherit;font-size:19px;padding:14px 16px;border-radius:20px;border:1px solid var(--edge);background:rgba(255,255,255,.7);resize:none;outline:none}
textarea:focus{box-shadow:0 0 0 4px rgba(10,157,99,.25)}
button{font:inherit;font-size:17px;font-weight:600;border:0;border-radius:999px;padding:14px 18px;cursor:pointer;transition:transform .15s}
button:active{transform:scale(.96)}
.primary{background:linear-gradient(145deg,#2fd08a,#0a7d4f);color:#fff;width:100%;margin-top:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 20px rgba(10,125,79,.3)}
.row{display:flex;gap:10px;margin-top:14px}.row button{flex:1}
.ok{background:linear-gradient(145deg,#2fd08a,#0a7d4f);color:#fff}.no{background:rgba(255,255,255,.75);border:1px solid var(--edge)}
.chip{display:inline-flex;align-items:center;padding:5px 12px;border-radius:999px;font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#fff}
.sale{background:linear-gradient(145deg,#2fd08a,#0a7d4f)}.purchase{background:linear-gradient(145deg,#ffb347,#e07b00)}.debt{background:linear-gradient(145deg,#ff6b6b,#c62828)}
.big{font-size:44px;font-weight:800;letter-spacing:-.03em;margin:10px 0 4px}.muted{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.grid div{background:rgba(255,255,255,.6);border:1px solid var(--edge);border-radius:18px;padding:10px 12px;font-size:13px;color:var(--muted)}
input.f{width:100%;font:inherit;font-size:17px;color:var(--ink);border:0;background:transparent;padding:4px 0;outline:none}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.totals>div{border-radius:22px;padding:14px 6px;background:rgba(255,255,255,.6);border:1px solid var(--edge);font-size:13px;color:var(--muted)}
.totals b{display:block;font-size:19px;color:var(--ink);margin-top:4px}
.ticon{width:40px;height:40px;margin:0 auto 6px;border-radius:12px;display:grid;place-items:center;font-size:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
ul{padding:0;margin:0}li{list-style:none;padding:12px 0;border-bottom:1px solid rgba(0,0,0,.06);display:flex;justify-content:space-between;align-items:center;gap:10px}li:last-child{border:0}
.wa{display:inline-block;margin-top:6px;background:linear-gradient(145deg,#3ee07a,#1ea952);color:#fff;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;text-decoration:none;white-space:nowrap}
.del{display:inline-block;margin-top:6px;margin-left:4px;text-decoration:none;font-size:15px}
.off{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(20,20,20,.75);color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;backdrop-filter:blur(12px)}
.ex{background:rgba(255,255,255,.7);border:1px solid var(--edge);font-size:14px;font-weight:500;padding:8px 12px;margin:8px 6px 0 0}

.fld{display:flex;gap:10px;align-items:center}.fld>span:last-child{flex:1;min-width:0}
.fi{width:36px;height:36px;flex:none;border-radius:11px;display:grid;place-items:center;font-size:18px;background:rgba(255,255,255,.85);box-shadow:inset 0 1px 0 #fff,0 3px 8px rgba(0,0,0,.08)}
.bi{display:inline-block}
@keyframes bub{0%{transform:scale(1) translateY(0)}40%{transform:scale(1.25) translateY(-4px) rotate(-8deg)}70%{transform:scale(.95) translateY(1px) rotate(4deg)}100%{transform:scale(1.08) translateY(-1px)}}
.fld:hover .fi,.fld:focus-within .fi,button:hover .bi,.totals>div:hover .ticon,header:hover .appicon,.wa:hover,.del:hover{animation:bub .5s cubic-bezier(.3,1.6,.5,1) forwards}
button{box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 16px rgba(0,0,0,.12)}
button:active{transform:scale(.96) translateY(2px);box-shadow:inset 0 4px 10px rgba(0,0,0,.28),inset 0 -1px 0 rgba(255,255,255,.3)!important;filter:brightness(.95)}
.ex:active{box-shadow:inset 0 3px 8px rgba(0,0,0,.18)!important}
.wa:active{box-shadow:inset 0 3px 8px rgba(0,0,0,.3)}
.fld:focus-within{box-shadow:0 0 0 3px rgba(10,157,99,.25)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}main>.box{opacity:1!important}}

/* ---- motion pack v1 ---- */
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes blob{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-20px) scale(1.08)}66%{transform:translate(-20px,15px) scale(.95)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,20px) scale(.9)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes ripple{to{transform:scale(4);opacity:0}}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r));opacity:0}}
@keyframes popNum{0%{transform:scale(1)}40%{transform:scale(1.25);color:#0a9d63}100%{transform:scale(1)}}
main>.box{opacity:0;animation:rise .6s cubic-bezier(.2,.9,.3,1.1) forwards}
main>.box:nth-child(2){animation-delay:.08s}main>.box:nth-child(3){animation-delay:.16s}main>.box:nth-child(4){animation-delay:.24s}
#confirm{animation:rise .45s cubic-bezier(.2,1.4,.4,1) forwards!important;opacity:1}
li{animation:slideIn .45s cubic-bezier(.2,.9,.3,1) both}
.appicon{animation:floaty 3.5s ease-in-out infinite}
.primary{background:linear-gradient(110deg,#0a7d4f 0%,#2fd08a 40%,#7ff0c0 50%,#2fd08a 60%,#0a7d4f 100%);background-size:200% 100%;animation:shimmer 4s linear infinite}
.bg-blob{position:fixed;width:340px;height:340px;border-radius:50%;filter:blur(60px);opacity:.45;z-index:-1;animation:blob 18s ease-in-out infinite}
button,.ex{position:relative;overflow:hidden}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);width:40px;height:40px;margin:-20px 0 0 -20px;transform:scale(0);animation:ripple .6s ease-out forwards;pointer-events:none}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:rgba(15,15,20,.82);color:#fff;padding:12px 18px;border-radius:999px;font-weight:600;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:50;animation:toastIn .35s cubic-bezier(.2,1.4,.4,1)}
.conf{position:fixed;top:-10px;width:9px;height:14px;border-radius:2px;z-index:60;pointer-events:none;animation:fall 1.4s cubic-bezier(.3,.6,.4,1) forwards}
.bump{display:inline-block;animation:popNum .5s ease}
.big{background:linear-gradient(90deg,#0b0b0f,#0a7d4f);-webkit-background-clip:text;background-clip:text;color:transparent}
li.gone{transition:all .35s ease;opacity:0;transform:translateX(60px);max-height:0;padding:0}
</style></head><body>
<div class="bg-blob" style="background:#ffcf6e;top:-80px;left:-80px"></div><div class="bg-blob" style="background:#6fe0b0;top:30%;right:-120px;animation-delay:-6s"></div><div class="bg-blob" style="background:#9dbcff;bottom:-120px;left:20%;animation-delay:-12s"></div>
<header><div class="appicon">🧺</div><div><h1>Oja Ledger</h1><p>Talk your sales. We write the book.</p></div></header>
<main>
<div class="box">
  <label class="muted">Wetin happen for market? (voice coming soon, type for now)</label>
  <textarea id="say" rows="2" placeholder="I sell 3 tuber yam 2k each"></textarea>
  <div id="examples"></div>
  <button class="primary" onclick="hear()"><span class="bi">✍🏾</span> Write am for book</button>
</div>
<div class="box" id="confirm" hidden></div>
<div class="box"><h3 style="margin-top:0">Today's money</h3>
  <div class="totals"><div><div class="ticon sale">💰</div>Sold<b id="tSale">₦0</b></div><div><div class="ticon purchase">📦</div>Bought<b id="tBuy">₦0</b></div><div><div class="ticon debt">📝</div>Owed you<b id="tDebt">₦0</b></div></div></div>
<div class="box"><h3 style="margin-top:0">Ledger</h3><ul id="book"></ul></div>
</main>
<script>
const NUM={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,half:.5,dozen:12};
const naira=n=>n==null?"-":"₦"+Number(n).toLocaleString("en-NG");
function money(t){t=t.toLowerCase().replace(/[,₦]|naira/g,"").trim();const m=t.match(/^(\d+(?:\.\d+)?)(k)?$/);if(!m)return null;let v=parseFloat(m[1]);return m[2]?v*1000:v}
function parse(text){
  const low=" "+text.toLowerCase()+" ";let type="sale";
  if(/owe|credit|go pay later|never pay/.test(low))type="debt";
  else if(/ i buy | i don buy |bought|restock/.test(low))type="purchase";
  let price=null,each=false;const pm=low.match(/(?:for|at|₦|n)\s*([\d,\.]+k?)|([\d,\.]+k)\b|([\d,]+)\s*naira/);
  if(pm){price=money(pm[1]||pm[2]||pm[3]);each=/\b(each|per|one one|apiece)\b/.test(low.slice(pm.index+pm[0].length,pm.index+pm[0].length+15))}
  if(price==null){const ns=(low.match(/\b\d[\d,]*k?\b/g)||[]).map(money).filter(n=>n&&n>=100);if(ns.length)price=Math.max(...ns)}
  let qty=null;for(const tok of low.match(/[a-z]+|\d+(?:\.\d+)?k?/g)||[]){let v=tok in NUM?NUM[tok]:(/^\d+(\.\d+)?$/.test(tok)?parseFloat(tok):null);if(v!=null&&v!==price){qty=v;break}}
  qty=qty||1;let item=null;
  const im=low.match(new RegExp("(?:\\d+|"+Object.keys(NUM).join("|")+")\\s+((?:[a-z]+\\s?){1,3}?)(?=\\s*(?:for|at|₦|\\d|each|per|$))"));if(im)item=im[1].trim();
  let who=null;if(type==="debt"){const d=low.match(/\bfor\s+([a-z]+(?:\s[a-z]+)?)/);if(d)item=d[1];const w=low.match(/^\s*([a-z]+(?:\s[a-z]+)?)\s+(?:dey\s+)?owe/);if(w)who=w[1].replace(/\b\w/g,c=>c.toUpperCase());qty=1}
  const total=price==null?null:(each?price*qty:price);const unit=price==null?null:(each?price:Math.round(price/qty*100)/100);
  return {time:new Date().toLocaleString("en-NG",{timeZone:"Africa/Lagos"}),type,item,qty,unit_price:unit,total,who,heard:text};
}

// ---- motion pack v1 ----
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>{d.style.transition="opacity .3s";d.style.opacity=0;setTimeout(()=>d.remove(),300)},1600)}
function confetti(){const c=["#2fd08a","#ffb347","#ff6b6b","#6f9dff","#ffd84d"];for(let i=0;i<36;i++){const p=document.createElement("i");p.className="conf";p.style.left=Math.random()*100+"vw";p.style.background=c[i%c.length];p.style.setProperty("--dx",(Math.random()*160-80)+"px");p.style.setProperty("--r",(Math.random()*720-360)+"deg");p.style.animationDelay=Math.random()*.25+"s";document.body.appendChild(p);setTimeout(()=>p.remove(),1800)}}
function countUp(el,to){const from=+(el.dataset.v||0);el.dataset.v=to;if(from===to){el.textContent=naira(to);return}const t0=performance.now(),d=700;
  (function f(t){const k=Math.min(1,(t-t0)/d),e=1-Math.pow(1-k,3);el.textContent=naira(Math.round(from+(to-from)*e));if(k<1)requestAnimationFrame(f);else{el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump")}})(t0)}
document.addEventListener("pointerdown",e=>{const b=e.target.closest("button,.ex");if(!b)return;const r=b.getBoundingClientRect(),s=document.createElement("span");s.className="rip";s.style.left=(e.clientX-r.left)+"px";s.style.top=(e.clientY-r.top)+"px";b.appendChild(s);setTimeout(()=>s.remove(),650);buzz(8)});
let draft=null;const book=JSON.parse(localStorage.oja||"[]");
function hear(){const t=document.getElementById("say").value.trim();if(!t)return;draft=parse(t);showConfirm()}
function showConfirm(){const e=draft,c=document.getElementById("confirm");c.hidden=false;
  const label={sale:"SALE 💰",purchase:"PURCHASE 📦",debt:"DEBT 📝"}[e.type];
  c.innerHTML=`<span class="chip ${e.type}">${label}</span><div class="big">${naira(e.total)}</div>
  <div class="muted">You talk: "${e.heard}"</div>
  <div class="grid"><div class="fld"><span class="fi">🛍️</span><span>Item<input class="f" id="fi" value="${e.item||""}"></span></div><div class="fld"><span class="fi">🔢</span><span>Qty<input class="f" id="fq" type="number" value="${e.qty}"></span></div>
  <div class="fld"><span class="fi">🏷️</span><span>Unit price<input class="f" id="fu" type="number" value="${e.unit_price??""}"></span></div><div class="fld"><span class="fi">${e.type==="debt"?"👤":"🔖"}</span><span>${e.type==="debt"?"Who owe":"Type"}<input class="f" id="fw" value="${e.type==="debt"?(e.who||""):e.type}"></span></div></div>
  <div class="row"><button class="no" onclick="cancel()"><span class="bi">✏️</span> No be am</button><button class="ok" onclick="confirmIt()"><span class="bi">✅</span> Correct!</button></div>`}
function confirmIt(){const q=+fq.value||1,u=fu.value===""?null:+fu.value;draft.item=fi.value;draft.qty=q;draft.unit_price=u;draft.total=u==null?draft.total:u*q;
  if(draft.type==="debt")draft.who=fw.value;else if(["sale","purchase","debt"].includes(fw.value))draft.type=fw.value;
  draft.status="confirmed";book.unshift(draft);confetti();buzz([12,40,12]);toast(draft.type==="debt"?"📝 Debt don enter book":"✅ E don enter book!");localStorage.oja=JSON.stringify(book);cancel();say.value="";render()}
function cancel(){draft=null;document.getElementById("confirm").hidden=true}
function waText(e){const d=e.time.split(",")[0];
  if(e.type==="debt")return `🧺 Oja Ledger\n${e.who||"You"}, you owe me ${naira(e.total)} for ${e.item||"goods"} (${d}).\nReply OK to agree. 🙏🏾`;
  if(e.type==="sale")return `🧺 Oja Ledger receipt\n${e.qty} ${e.item||"item"} @ ${naira(e.unit_price)}\nTotal: ${naira(e.total)} (${d})\nThank you, come again! 🙏🏾`;
  return `🧺 Oja Ledger\nI bought ${e.qty} ${e.item||"goods"} from you for ${naira(e.total)} (${d}). Please confirm. 🙏🏾`}
function waLink(e){return "https://wa.me/?text="+encodeURIComponent(waText(e))}
function del(i){if(window.confirm("Remove this entry?")){const li=document.getElementById("book").children[i];buzz(20);if(li)li.classList.add("gone");setTimeout(()=>{book.splice(i,1);localStorage.oja=JSON.stringify(book);render();toast("🗑 Entry don comot")},330)}}
function render(){const s={sale:0,purchase:0,debt:0};const today=new Date().toLocaleDateString("en-NG",{timeZone:"Africa/Lagos"});
  book.forEach(e=>{if(e.time.startsWith(today))s[e.type]+=e.total||0});
  countUp(tSale,s.sale);countUp(tBuy,s.purchase);countUp(tDebt,s.debt);
  document.getElementById("book").innerHTML=book.map((e,i)=>`<li style="animation-delay:${Math.min(i,8)*45}ms"><span><span class="chip ${e.type}">${e.type}</span> ${e.qty} ${e.item||""}${e.who?" · "+e.who:""}<br><span class="muted">${e.time}</span></span><span style="text-align:right"><b>${naira(e.total)}</b><br><a class="wa" target="_blank" href="${waLink(e)}">Send on WhatsApp</a> <a class="del" href="#" onclick="del(${i});return false">🗑</a></span></li>`).join("")||'<span class="muted">Nothing yet. Market never open? 😄</span>'}
["I sell 3 tuber yam 2k each","Mama Chidi buy 2 bag rice for 90000","I don buy 5 crate egg for 25k","Emeka owe me 1500 for pepper"].forEach(x=>{const b=document.createElement("button");b.className="ex";b.textContent=x;b.onclick=()=>{say.value=x;hear()};examples.appendChild(b)});
render();
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js");
function net(){let b=document.getElementById("offb");if(!navigator.onLine){if(!b){b=document.createElement("div");b.id="offb";b.className="off";b.textContent="📴 No network? No wahala. Oja still dey work.";document.body.appendChild(b)}}else if(b)b.remove()}
addEventListener("online",net);addEventListener("offline",net);net();
</script></body></html>
